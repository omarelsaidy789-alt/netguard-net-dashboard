s<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetGuard | Network Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>


  <nav class="navbar navbar-dark border-bottom border-secondary-subtle px-3">
    <span class="navbar-brand fw-bold">
      <span class="text-success">&#9679;</span> NetGuard
      <small class="text-secondary fw-normal">Network Analyzer &amp; IDS</small>
    </span>
    <div class="d-flex gap-2 flex-wrap">
      <button id="btn-scan" class="btn btn-sm btn-outline-info">Scan Network</button>
      <a class="btn btn-sm btn-outline-success" href="/api/export?format=json">Export JSON</a>
      <a class="btn btn-sm btn-outline-success" href="/api/export?format=csv">Export CSV</a>
    </div>
  </nav>

  <main class="container-fluid p-3">

    
    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3">
        <div class="card stat-card"><div class="card-body">
          <div class="stat-label">Download</div>
          <div id="stat-down" class="stat-value text-info">0 B/s</div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card"><div class="card-body">
          <div class="stat-label">Upload</div>
          <div id="stat-up" class="stat-value text-warning">0 B/s</div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card"><div class="card-body">
          <div class="stat-label">Packets / sec</div>
          <div id="stat-pps" class="stat-value text-success">0</div>
        </div></div>
      </div>
      <div class="col-6 col-lg-3">
        <div class="card stat-card"><div class="card-body">
          <div class="stat-label">Devices / Alerts</div>
          <div class="stat-value">
            <span id="stat-devices" class="text-light">0</span>
            <span class="text-secondary">/</span>
            <span id="stat-alerts" class="text-danger">0</span>
          </div>
        </div></div>
      </div>
    </div>

    
    <div class="row g-3 mb-3">
      <div class="col-lg-8">
        <div class="card"><div class="card-header">Bandwidth (real-time)</div>
          <div class="card-body chart-box"><canvas id="bandwidthChart"></canvas></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card"><div class="card-header">Packets / sec</div>
          <div class="card-body chart-box"><canvas id="packetsChart"></canvas></div>
        </div>
      </div>
    </div>

   
    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span>Connected Devices</span>
            <small id="scan-info" class="text-secondary"></small>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
              <thead>
                <tr><th>IP</th><th>MAC</th><th>Hostname</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="devices-body">
                <tr><td colspan="5" class="text-secondary text-center py-3">Scanning...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span>Security Alerts</span>
            <div class="d-flex gap-1">
              <button id="btn-sim-scan" class="btn btn-sm btn-outline-secondary">Simulate Port Scan</button>
              <button id="btn-sim-rogue" class="btn btn-sm btn-outline-secondary">Simulate Rogue</button>
            </div>
          </div>
          <ul id="alerts-list" class="list-group list-group-flush alerts-list">
            <li class="list-group-item text-secondary text-center">No alerts</li>
          </ul>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
